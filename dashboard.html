<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBlog - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">DevBlog</a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
                <li><a href="create-blog.html">Create Blog</a></li>
                <li id="userInfo" style="font-weight: bold; color: #007bff; display: flex; align-items: center;"></li>
                <li>
                    <button id="logoutBtn" style="background: #dc3545; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; display: none;">Logout</button>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Main Dashboard Container -->
    <main class="container">
        <div class="dashboard-header" style="margin-top: 20px;">
            <div>
                <h2>User Dashboard</h2>
                <p>Welcome <span id="welcomeUserName" style="font-weight: bold; color: #007bff;">User</span>! Manage your published blogs and articles.</p>
            </div>
            <a href="create-blog.html" class="btn-primary">+ Create New Blog</a>
        </div>

        <!-- Table View for Managed Posts -->
        <div class="table-container">
            <table class="dashboard-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Date Created</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userBlogsList">
                    <!-- Dynamic Logged-in User's Rows will be rendered here by script.js -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 DevBlog. Built with HTML, CSS & JS.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
