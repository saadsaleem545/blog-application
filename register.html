<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBlog - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">DevBlog</a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="create-blog.html">Create Blog</a></li>
                <li><a href="login.html" class="btn-login">Login</a></li>
                <li><a href="register.html" class="active btn-register">Register</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Register Form Container -->
    <main class="auth-container">
        <div class="auth-card">
            <h2>Create an Account</h2>
            <p class="auth-subtitle">Join DevBlog to publish and share your tech articles.</p>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Saad Saleem" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
                </div>

                <button type="submit" class="btn-submit">Sign Up</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 DevBlog. Built with HTML, CSS & JS.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
